name: Scheduled Rebuild (PSX data)

# Rebuilds features/models from whatever PSX export currently sits in
# raw_uploads/, and commits the result. This does NOT fetch new data from
# PSX automatically — PSX's terms of use prohibit automated scraping, so
# refreshing raw_uploads/ with a newer manually-downloaded export is a
# separate, manual step (see README "Keeping data fresh"). This workflow
# just keeps the derived data/models in sync whenever that file changes,
# and can also be triggered manually.

on:
  schedule:
    - cron: "0 22 * * 1-5"   # 22:00 UTC, Mon-Fri — adjust as needed
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild from current raw_uploads/ export
        run: python scripts/update_data.py

      - name: Commit updated data
        run: |
          git config --global user.name "scheduled-rebuild-bot"
          git config --global user.email "actions@github.com"
          git add data/ models/ logs/
          git diff --staged --quiet || git commit -m "Automated rebuild from current PSX export"
          git push
