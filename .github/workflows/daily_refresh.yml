name: Daily PSX Data Refresh

# Automatically fetches new PSX data every trading day via psx_api_fetch.py
# (psxdata under the hood — see README "Data source & licensing" for the
# trade-off this represents), incrementally updates the stored dataset,
# retrains models, and commits the result. Streamlit Community Cloud
# redeploys on every push, so this is what keeps the LIVE app's data and
# predictions current with zero manual work.
#
# NOTE ON TIMING: PSX (Pakistan Stock Exchange) trading hours are roughly
# 09:30-15:30 PKT (UTC+5), Mon-Fri. This runs after close in PKT.

on:
  schedule:
    - cron: "0 17 * * 1-5"   # 17:00 UTC = 22:00 PKT, well after PSX close, Mon-Fri
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch new PSX data + rebuild features + retrain models
        run: python scripts/update_data.py

      - name: Commit updated data
        run: |
          git config --global user.name "daily-refresh-bot"
          git config --global user.email "actions@github.com"
          git add data/ models/ logs/
          git diff --staged --quiet || git commit -m "Automated daily PSX data refresh"
          git push
